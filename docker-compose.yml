services:
  # ============================================================================
  # PostgreSQL 16 — Relational Metadata Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hums_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hums_user
      POSTGRES_PASSWORD: hums_password
      POSTGRES_DB: hums_db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hums_user -d hums_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis 7 — Cache, Rate Limiter & Celery Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hums_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # MinIO — S3-Compatible Object Storage for Audio & Waveforms
  # ============================================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: hums_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MinIO Bucket Provisioner — Auto-creates default hums-audio bucket
  # ============================================================================
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: hums_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/hums-audio;
      /usr/bin/mc anonymous set download local/hums-audio;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
